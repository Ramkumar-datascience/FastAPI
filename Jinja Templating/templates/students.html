{% extends "layout.html" %}
<html>

<body>
    {% block students %}
    <h1>Students List</h1>
    <ul>
        {% for student in students %}
            <li>{{ student.name }} - {{ student.age }} years old</li>
        {% endfor %}
    </ul>
    {% if students %}
        <p>Total students: {{ students|length }}</p>
    {% else %}
        <p>No students found.</p>
    {% endif %}
    
    {% endblock %}
</body>
</html>
